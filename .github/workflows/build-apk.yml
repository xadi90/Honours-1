name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK & Accept Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Restore Keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -s debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ -n "$DEBUG_KEYSTORE_BASE64_SECRET" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64_SECRET" | tr -d '[:space:]' | base64 -d > debug.keystore || rm -f debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          else
            PREV_KS_COMMIT=$(git log -n 1 --diff-filter=AM --format=%H -- debug.keystore.base64 || true)
            if [ -n "$PREV_KS_COMMIT" ]; then
              git show "${PREV_KS_COMMIT}:debug.keystore.base64" | tr -d '[:space:]' | base64 -d > debug.keystore || rm -f debug.keystore
              echo "Restored debug.keystore from git history commit ${PREV_KS_COMMIT}."
            else
              echo "::warning::debug.keystore.base64 missing! Generating fallback debug.keystore (Google Sign-In SHA-1 may not match Firebase)."
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Verify or Restore google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -s app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              PREV_GS_COMMIT=$(git log -n 1 --diff-filter=AM --format=%H -- app/google-services.json || true)
              if [ -n "$PREV_GS_COMMIT" ]; then
                git show "${PREV_GS_COMMIT}:app/google-services.json" > app/google-services.json || rm -f app/google-services.json
                echo "Restored app/google-services.json from git history commit ${PREV_GS_COMMIT}."
              fi
            fi
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::Missing app/google-services.json! Upload app/google-services.json to app/ on GitHub OR set GOOGLE_SERVICES_JSON in GitHub Repository Secrets."
            exit 1
          fi
          if ! python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
            echo "::error::app/google-services.json is not valid JSON. Check GOOGLE_SERVICES_JSON secret formatting."
            exit 1
          fi
          if grep -q "remixed-project-id" app/google-services.json; then
            echo "::error::app/google-services.json contains placeholder remixed-project-id."
            exit 1
          fi
          echo "Verified app/google-services.json is present and valid."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Honours Solution APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-ci.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          cp debug.keystore upload-ci.jks
          keytool -changealias -alias androiddebugkey -destalias upload -keystore upload-ci.jks -storepass android -keypass android
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/HonoursSolution.apk
          rm -f upload-ci.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonoursSolution-APK
          path: release-apk/HonoursSolution.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Honours Solution v1.0.${{ github.run_number }}
          body: |
            Automated build of **Honours Solution** (National University, Bangladesh).
            Direct APK Download: `HonoursSolution.apk`
          make_latest: true
          files: |
            release-apk/HonoursSolution.apk
